name: Feature request
description: Suggest a GAPLink feature.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What should GAPLink do?
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: GAP reference
      description: Link the relevant GAP function or package, if known.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add version, package, platform, or API details.
