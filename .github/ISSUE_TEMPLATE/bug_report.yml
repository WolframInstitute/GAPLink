name: Bug report
description: Report a GAPLink bug.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use the private advisory link.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: GAPLink, Wolfram Language, GAP, and operating system.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Example
      render: wolfram
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
