name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check whitespace and line endings
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD

      - name: Check repository hooks
        run: |
          test -x .githooks/commit-msg
          test -x .githooks/pre-commit
          test -x .githooks/pre-push
          sh -n .githooks/commit-msg
          sh -n .githooks/pre-commit
          sh -n .githooks/pre-push

      - name: Check runtime build script
        run: |
          test -x scripts/build-runtime.sh
          bash -n scripts/build-runtime.sh

  paclet:
    name: Check, test, build, and verify (Wolfram 15.0)
    needs: repository
    outputs:
      version: ${{ steps.build.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: wolframresearch/wolframengine:15.0
      options: --user root
    env:
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Wolfram Engine entitlement
        run: |
          if [ -z "${WOLFRAMSCRIPT_ENTITLEMENTID:-}" ]; then
            echo "::error title=Missing Wolfram license::Add WOLFRAMSCRIPT_ENTITLEMENTID as a repository secret; see CONTRIBUTING.md."
            exit 1
          fi

      - name: Check, test, build, and verify
        id: build
        run: wolframscript -file scripts/all.wls

  runtime-unix:
    name: GAP runtime (${{ matrix.system-id }})
    needs: repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            system-id: Linux-x86-64
          - runner: macos-15
            system-id: MacOSX-ARM64
          - runner: macos-15-intel
            system-id: MacOSX-x86-64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore runtime
        id: runtime-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/runtimes/${{ matrix.system-id }}/*.tar.gz*
            ${{ matrix.system-id == 'Linux-x86-64' && 'build/runtime-sources/*.tar.gz' || '' }}
          key: gaplink-runtime-${{ matrix.system-id }}-${{ hashFiles('scripts/build-runtime.sh') }}

      - name: Install Linux build tools
        if: runner.os == 'Linux' && steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl patchelf zlib1g-dev

      - name: Build runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: make runtime

      - name: Check runtime archive
        run: |
          cd build/runtimes/${{ matrix.system-id }}
          checksum=(*.sha256)
          test "${#checksum[@]}" -eq 1
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${checksum[0]}"
          else
            shasum -a 256 -c "${checksum[0]}"
          fi

      - name: Upload runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GAPLink-runtime-${{ matrix.system-id }}
          path: build/runtimes/${{ matrix.system-id }}/*.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload GAP sources
        if: matrix.system-id == 'Linux-x86-64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GAPLink-runtime-sources
          path: build/runtime-sources/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  runtime-windows:
    name: GAP runtime (Windows-x86-64)
    needs: repository
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore runtime
        id: runtime-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/runtimes/Windows-x86-64/*.tar.gz*
          key: gaplink-runtime-Windows-x86-64-${{ hashFiles('scripts/build-runtime-windows.ps1') }}

      - name: Build runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-runtime-windows.ps1

      - name: Check runtime archive
        shell: pwsh
        run: |
          $Archives = @(Get-ChildItem build/runtimes/Windows-x86-64/*.tar.gz)
          if ($Archives.Count -ne 1) { throw "Expected one runtime archive" }
          $Expected = (Get-Content "$($Archives[0].FullName).sha256").Split()[0]
          $Actual = (Get-FileHash $Archives[0] -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Actual -ne $Expected) { throw "Runtime checksum does not match" }

      - name: Upload runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GAPLink-runtime-Windows-x86-64
          path: build/runtimes/Windows-x86-64/*.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  gap:
    name: GAP ${{ matrix.gap-version }}
    needs: paclet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        gap-version: ["4.14.0", "4.15.1", "4.16.1"]
    container:
      image: wolframresearch/wolframengine:15.0
      options: --user root
    env:
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Wolfram Engine entitlement
        run: test -n "${WOLFRAMSCRIPT_ENTITLEMENTID:-}"

      - name: Install GAP build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential jq libdigest-sha-perl libgmp-dev libreadline-dev \
            sudo wget zlib1g-dev

      - name: Set up GAP
        uses: gap-actions/setup-gap@f12222f1b86ce1f8a246c4000abfd6e69893411c # v3
        with:
          gap-version: ${{ matrix.gap-version }}

      - name: Test GAP
        run: |
          GAPLINK_GAP="$GAPROOT/gap" \
          GAPLINK_EXPECTED_GAP_VERSION="${{ matrix.gap-version }}" \
          make test-gap

  bundles:
    name: Build platform paclets
    needs: [paclet, runtime-unix, runtime-windows, gap]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: wolframresearch/wolframengine:15.0
      options: --user root
    env:
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install archive tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make unzip zip

      - name: Download runtimes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: GAPLink-runtime-*-x86-64
          path: build/runtime-artifacts
          merge-multiple: true

      - name: Download Apple silicon runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: GAPLink-runtime-MacOSX-ARM64
          path: build/runtime-artifacts

      - name: Check and extract runtimes
        run: |
          cd build/runtime-artifacts
          sha256sum -c *.sha256
          for archive in *.tar.gz; do
            system=${archive#GAPLink-runtime-}
            system=${system%.tar.gz}
            mkdir -p "../ci-runtimes/$system"
            tar -xzf "$archive" -C "../ci-runtimes/$system"
          done

      - name: Build platform paclets
        run: |
          for system in Linux-x86-64 MacOSX-ARM64 MacOSX-x86-64 Windows-x86-64; do
            make bundle \
              RUNTIME="$PWD/build/ci-runtimes/$system/runtime" \
              SYSTEM_ID="$system"
          done

      - name: Test Linux paclet
        run: |
          GAPLINK_VERIFY_INSTALL=1 make verify-bundle
          GAPLINK_GAP="$PWD/build/ci-runtimes/Linux-x86-64/runtime/gap" \
          GAPLINK_EXPECTED_GAP_VERSION=4.16.1 \
          make test-gap

      - name: Collect platform paclets
        run: |
          mkdir -p build/dist
          cp build/bundles/*/*.paclet build/dist/

      - name: Upload platform paclets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GAPLink-${{ needs.paclet.outputs.version }}
          path: build/dist/*.paclet
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
