name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    outputs:
      run: ${{ steps.release.outputs.run }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find verified paclet
        id: release
        run: |
          version=$(sed -n 's/^[[:space:]]*"Version" -> "\([^"]*\)",/\1/p' GAPLink/PacletInfo.wl)
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=Version mismatch::$TAG does not match version $version."
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main || {
            echo '::error title=Release commit::The release commit must be on main.'
            exit 1
          }
          run=$(gh run list --workflow ci.yml --branch main --commit "$(git rev-parse HEAD)" \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error title=Missing CI run::No successful main CI run found for $GITHUB_SHA."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Download verified paclet
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: GAPLink-${{ steps.release.outputs.version }}
          path: dist
          run-id: ${{ steps.release.outputs.run }}
          github-token: ${{ github.token }}

      - name: Download GAP sources
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: GAPLink-runtime-sources
          path: dist
          run-id: ${{ steps.release.outputs.run }}
          github-token: ${{ github.token }}

      - name: Check files and create checksums
        run: |
          cd dist
          gap_version=$(sed -n 's/^gap_version=//p' ../scripts/build-runtime.sh)
          for system in Linux-x86-64 MacOSX-ARM64 MacOSX-x86-64 Windows-x86-64; do
            file="WolframInstitute__GAPLink-$system-${{ steps.release.outputs.version }}.paclet"
            test -f "$file" || {
              echo "::error title=Missing paclet::$file was not found."
              exit 1
            }
          done
          for file in \
            "gap-$gap_version-core.tar.gz" \
            "packages-required-v$gap_version.tar.gz"; do
            test -f "$file" || {
              echo "::error title=Missing source::$file was not found."
              exit 1
            }
          done
          for file in *.paclet *.tar.gz; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Keep release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paclet
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Create GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi

  # A license line is issued for one machine name. The publishing container gets that name as
  # its host name, so the name is read here, before that container starts. Without a license
  # line it is a default name; see CONTRIBUTING.md, "CI".
  license:
    name: Wolfram license
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      machine-name: ${{ steps.machine.outputs.name }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the machine name of the license
        id: machine
        env:
          WOLFRAM_MATHPASS_B64: ${{ secrets.WOLFRAM_MATHPASS_B64 }}
        run: |
          name=$(scripts/license-machine-name.sh)
          echo "name=$name" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish with PacletPage
    needs: [release, license]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: wolframresearch/wolframengine:15.0
      # The host name and the machine-id in .github/actions/wolfram-license give the
      # container the MathID that the license line is issued for.
      options: --user root --hostname ${{ needs.license.outputs.machine-name || 'gaplink-ci' }}
    env:
      # With a license line the kernel is licensed offline, and the entitlement is left out.
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAM_MATHPASS_B64 == '' && secrets.WOLFRAMSCRIPT_ENTITLEMENTID || '' }}
      WOLFRAM_CLOUD_USER: ${{ secrets.WOLFRAM_CLOUD_USER }}
      WOLFRAM_CLOUD_PASSWORD: ${{ secrets.WOLFRAM_CLOUD_PASSWORD }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install publishing tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make python3
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check cloud credentials
        run: |
          for name in WOLFRAM_CLOUD_USER WOLFRAM_CLOUD_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing credential::$name is not set."
              exit 1
            fi
          done

      - name: Verify Wolfram Engine license
        uses: ./.github/actions/wolfram-license
        with:
          mathpass: ${{ secrets.WOLFRAM_MATHPASS_B64 }}

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: paclet
          path: build

      - name: Download the verified PacletPage build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: GAPLink-pacletpage
          path: build
          run-id: ${{ needs.release.outputs.run }}
          github-token: ${{ github.token }}

      - name: Restore documentation tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: pacletpage-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Restore the verified build
        run: |
          (cd build && sha256sum -c *.sha256)
          tar -xzf build/pacletpage-build.tar.gz -C GAPLink
          make deps

      - name: Publish the resource and documentation site
        id: publish
        run: make publish

      - name: Add summary
        run: |
          echo '### Published to Wolfram Cloud' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Archives: ${{ steps.publish.outputs.archives }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Resource: ${{ steps.publish.outputs.page }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Documentation: ${{ steps.publish.outputs.site }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Install: `PacletInstall[ResourceObject["${{ steps.publish.outputs.page }}"]["PacletFile"], ForceVersionInstall -> True, "ShowProgress" -> True]`' >> "$GITHUB_STEP_SUMMARY"
