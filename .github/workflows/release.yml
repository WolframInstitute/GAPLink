name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Find verified paclet
        id: release
        run: |
          version=$(sed -n 's/^[[:space:]]*"Version" -> "\([^"]*\)",/\1/p' GAPLink/PacletInfo.wl)
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=Version mismatch::$TAG does not match version $version."
            exit 1
          fi
          run=$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error title=Missing CI run::No successful main CI run found for $GITHUB_SHA."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Download verified paclet
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: GAPLink-${{ steps.release.outputs.version }}
          path: dist
          run-id: ${{ steps.release.outputs.run }}
          github-token: ${{ github.token }}

      - name: Download GAP sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: GAPLink-runtime-sources
          path: dist
          run-id: ${{ steps.release.outputs.run }}
          github-token: ${{ github.token }}

      - name: Check files and create checksums
        run: |
          cd dist
          gap_version=$(sed -n 's/^gap_version=//p' ../scripts/build-runtime.sh)
          for system in Linux-x86-64 MacOSX-ARM64 MacOSX-x86-64 Windows-x86-64; do
            file="WolframInstitute__GAPLink-$system-${{ steps.release.outputs.version }}.paclet"
            test -f "$file" || {
              echo "::error title=Missing paclet::$file was not found."
              exit 1
            }
          done
          for file in \
            "gap-$gap_version-core.tar.gz" \
            "packages-required-v$gap_version.tar.gz"; do
            test -f "$file" || {
              echo "::error title=Missing source::$file was not found."
              exit 1
            }
          done
          for file in *.paclet *.tar.gz; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Keep release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paclet
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Create GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
